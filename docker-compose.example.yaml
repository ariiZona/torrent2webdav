services:
  torrent2webdav:
    # Built by .github/workflows/image.yml. If the GHCR package is private,
    # run `docker login ghcr.io` before pulling.
    image: ghcr.io/ariizona/torrent2webdav:latest
    # The image runs as 1000:1000; ./cache must be writable by that uid.
    user: "1000:1000"
    # build: .
    # On Linux, network_mode: host gives the best peer connectivity and lets
    # you drop the ports block below.
    # TORRENT_PORT comes from .env (copy .env.example) or the shell. It sets
    # both the published ports and the app's listen port.
    ports:
      # WebDAV is bound to localhost by default: put a TLS reverse proxy in
      # front of it before exposing it on the LAN (see README).
      - "127.0.0.1:8080:8080/tcp"
      - "${TORRENT_PORT:-42069}:${TORRENT_PORT:-42069}/tcp" # BitTorrent
      - "${TORRENT_PORT:-42069}:${TORRENT_PORT:-42069}/udp" # BitTorrent uTP / DHT
    environment:
      TORRENT_FILE: /torrents/example.torrent
      TORRENT_PORT: "${TORRENT_PORT:-42069}"
      # CACHE_MAX_SIZE: 50G
      # CACHE_TTL: 24h
      # UPLOAD_RATE: 1M
      # FULL_CACHE_AFTER: 250M
      # WEBDAV_USER: rclone
      # WEBDAV_PASS: change-me
      # Change the container port here AND in the ports mapping above.
      # WEBDAV_ADDR: ":8080"
    volumes:
      - ./torrents:/torrents:ro
      - ./cache:/cache
    restart: unless-stopped
